<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedVision - Bone Fracture Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #1c1c1c, #2c3e50);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #00d4ff;
    }

    h2 {
      font-size: 1.5em;
      margin-bottom: 30px;
      color: #a1ecff;
    }

    .upload-section {
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: #00d4ff;
      color: #000;
      padding: 12px 25px;
      margin: 10px 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #00aacc;
      color: #fff;
    }

    .about-content, .result-container {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      display: none;
      text-align: left;
    }

    #uploaded-image {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .result-box {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
    }

    canvas {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MedVision</h1>
    <h2>X-ray Fracture Analyzer</h2>

    <form class="upload-section" method="post" action="/upload" enctype="multipart/form-data">
      <input type="file" name="file" id="file-input" accept="image/*" />
      <button type="button" class="btn" id="upload-btn">Upload Image</button>
      <button type="submit" class="btn" id="submit-btn" style="display: none;">Analyze</button>
    </form>

    <button class="btn" id="about-toggle">About MedVision</button>

    <div class="about-content" id="aboutContent">
      <h3>About the Project</h3>
      <p>
        MedVision is an AI-based tool designed to detect bone fractures in X-ray images using deep learning techniques with 85% accuracy.
      </p>
    </div>

    <div class="result-container" id="resultContainer">
      <h3>Analysis Result</h3>
      <img id="uploaded-image" src="" alt="Uploaded image" />
      <div class="result-box" id="analysis-result">
        Analyzing...
      </div>
      <canvas id="confidenceChart" width="300" height="300"></canvas>
    </div>
  </div>

  <!-- Sound -->
  <audio id="analyze-sound" src="/static/analyze.mp3" preload="auto"></audio>

  <script>
  const fileInput = document.getElementById('file-input');
  const uploadBtn = document.getElementById('upload-btn');
  const submitBtn = document.getElementById('submit-btn');
  const uploadedImage = document.getElementById('uploaded-image');
  const resultContainer = document.getElementById('resultContainer');
  const analysisResult = document.getElementById('analysis-result');
  const aboutToggle = document.getElementById('about-toggle');
  const aboutContent = document.getElementById('aboutContent');
  const sound = document.getElementById('analyze-sound');

  // زر رفع الصورة
  uploadBtn.addEventListener('click', () => fileInput.click());

  // عندما يتم اختيار صورة
  fileInput.addEventListener('change', function () {
    if (this.files && this.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        uploadedImage.src = e.target.result;
        resultContainer.style.display = 'block';
      };
      reader.readAsDataURL(this.files[0]);
      submitBtn.style.display = 'inline-block';
    }
  });

  // عرض/إخفاء قسم "حول"
  aboutToggle.addEventListener('click', () => {
    aboutContent.style.display = aboutContent.style.display === 'block' ? 'none' : 'block';
  });

  // بيانات التحليل القادمة من الباكند (Flask)
  const result = "{{ result|default('') }}";
  const confidence = parseFloat("{{ confidence|default(0.0) }}");
  const filename = "{{ filename|default('') }}";

  // إذا كانت هناك نتيجة، يتم عرضها
  if (filename) {
    uploadedImage.src = `/static/uploads/${filename}`;
    resultContainer.style.display = 'block';

    // تشغيل الصوت
    sound.play();

    // عرض النتيجة كنص
    analysisResult.innerHTML = `
      <p><strong>Result:</strong> ${result}</p>
      <p><strong>Confidence:</strong> ${(confidence * 100).toFixed(2)}%</p>
    `;

    // عرض الرسم البياني
    const ctx = document.getElementById('confidenceChart').getContext('2d');
    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['Fracture Confidence', 'Remaining'],
        datasets: [{
          data: [confidence * 100, 100 - (confidence * 100)],
          backgroundColor: ['#00d4ff', '#555']
        }]
      },
      options: {
        plugins: {
          legend: {
            labels: { color: 'white' }
          }
        }
      }
    });
  }
  </script>
</body>
</html>
